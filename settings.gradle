pluginManagement {
    plugins {
        id "org.springframework.boot" version "3.4.1"
        id "io.spring.dependency-management" version "1.1.7"
    }
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = "hana-root"

include(
    "hana-common",
    "hana-event",
    "hana-gateway",
    "hana-digitaltwin",
)
