server:
  port: 8081
  #port: 8088

storage:
  postgres:
    driver: "postgresql"
    host: 192.168.250.88
    port: 5432
    user: mpole
    password: "1q2w3e"
    database: hdt
    schema: core
    # 커넥션 풀(2026-10-16) — 풀 없이 쿼리마다 연결을 열다 DB max_connections(100) 초과가 났다.
    # 같은 DB 를 쓰는 서버 전체(event·gateway·digitaltwin × 실행 PC 수) 합이 100 을 넘지 않게 잡을 것.
    pool:
      max-size: 20            # 동시 연결 상한. 넘치면 에러 대신 대기
      initial-size: 2         # 기동 시 미리 열어 둘 연결
      max-idle-time: 10m      # 이만큼 쉰 연결은 정리
      max-life-time: 30m      # 이만큼 지난 연결은 교체
      max-acquire-time: 10s   # 이 시간 안에 연결을 못 얻으면 에러(무한 대기 방지)

spring:
  application:
    name: hana-event

  kafka:
    #bootstrap-servers: 192.168.5.4:9092
    bootstrap-servers: 192.168.250.249:9092
    consumer:
      max-poll-records: 10000
      group-id: hdt-event-server-group-2 # 아무 이름이나 지정 (공백 금지)
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      #value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # 서버로부터 한 번에 땡겨올 총량 (24MB 뭉치를 고려해 50MB 정도로 설정)
        fetch.max.bytes: 52428800
        # 파티션 하나당 땡겨올 양 (메시지 하나가 24MB이므로 그보다 커야 함)
        max.partition.fetch.bytes: 31457280
        # TCP 소켓 수신 버퍼 (네트워크 톱니바퀴 방지용)
        receive.buffer.bytes: 33554432
        # [추가] JSON을 어떤 객체로 바꿀지 명시
        spring.json.value.default.type: com.mpole.hana.common.dto.DeviceBundle
        spring.json.trusted.packages: "*"
hdt:
  kafka:
    topic:
      view01: view01                      # gateway 의 hdt.kafka.topic.view01 과 동일해야 함
      view02: view02                      # gateway 의 hdt.kafka.topic.view02 와 동일해야 함

  # 인프라 상태 수신·상속 수렴(도메인 관점이라 infra 네이밍 유지 — 수집 관점인 gateway 는 dbview.viewNN).
  # gateway 의 hdt.dbview.view02.enabled 와 짝을 이룬다(둘 다 true 여야 동작).
  dbview:
    view02:
      enabled: true

  # 이벤트 평가 보조 주기 작업(eventTaskScheduler 전용 스레드, gateway 의 dbview.viewNN 폴링과 같은 방식)
  event:
    rule-refresh-ms: 30000                # 규칙 캐시(EventRuleCache) 리로드 주기 = 규칙 변경의 최대 반영 지연
    ack-sweep-ms: 30000                   # UNTIL_ACKED 억제 해제 확인(ActiveEventStore) 주기
    dump-active-on-change: true           # 발생·해소·재활성·확인마다 활성맵 전체를 격자로 INFO 로그(개발자용). 운영에서 활성 수백 건이면 false
    # 이벤트 연동 디바이스 제어(2026-10-12) — 발생(ON_OCCUR)·확인(ON_ACK) 시 digitaltwin 내부 API 로 실행을 맡긴다
    control:
      enabled: true                       # false 면 제어 호출을 아예 안 보낸다(장비를 움직이면 안 되는 테스트 환경)
      digitaltwin-base-url: http://localhost:8082   # digitaltwin 서버 주소(같은 서버면 localhost). 운영 배포 시 확인
      timeout: 15s                        # 응답 대기 상한. 여러 장비를 순차 제어하므로 XN 타임아웃(연결3s+읽기3s)×건수 고려

  # 현재값 기록 방식(2026-10-26 태그 단위 병합 시험)
  #   REPLACE 기존(points 통째 교체) / SHADOW 기존 + 병합을 복사 테이블(tbl_device_current_value_merge_test)에 따로 기록 / MERGE 병합으로 실제 기록
  #   SHADOW 전 scripts/current-value/2026-10-26-current-value-merge-test.sql 로 복사 테이블을 만들 것
  current-value:
    write-mode: MERGE

  # 누적 전력량 5분 스냅샷·포인트 배율(2026-10-12) — 설정 원천은 카테고리 스키마(관리자 > 장비 카테고리 관리 > 포인트 스키마 "고급")
  energy:
    snapshot-enabled: true                # false 면 5분 스냅샷을 찍지 않는다(금일·금월 기준값이 안 쌓임)
    snapshot-cron: "0 */5 * * * *"        # 5분 정각(KST)
    meta-refresh-ms: 30000                # 스키마(누적·배율) 리로드 주기 = 관리자 설정의 최대 반영 지연

management:
  server:
    port: 8091
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always