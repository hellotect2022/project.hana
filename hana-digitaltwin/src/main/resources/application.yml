server:
  port: 8082

# Swagger UI: 어노테이션 런타임 스펙 대신, 테스트로 생성된 OpenAPI(/docs/openapi3.json)를 로드 (순수 REST Docs)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    #url: /docs/openapi3.json
    # 💡 기본 펼침 상태 설정 (none으로 하면 모두 접힌 채로 시작합니다)
    doc-expansion: none
    path: /swagger-ui.html   # 👈 /swagger-ui/index.html 대신 이렇게 변경하세요!
    #path: /swagger-ui/index.html


spring:
  application:
    name: hana-digitaltwin

  # 물리버튼(enocean) → DeviceBundle → view01 발행용 producer (2026-10-01). gateway/event 와 같은 브로커.
  # 역직렬화는 event 가 spring.json.value.default.type=DeviceBundle 로 하므로 타입 헤더를 붙이지 않는다.
  kafka:
    bootstrap-servers: 192.168.250.249:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

  datasource:
    main:
      jdbc-url: jdbc:postgresql://192.168.250.88:5432/hdt?currentSchema=core&reWriteBatchedStatements=true
      #jdbc-url: jdbc:postgresql://192.168.250.249:5432/hdt?currentSchema=core2&reWriteBatchedStatements=true
      username: testuser
      password: 1q2w3e
      driver-class-name: org.postgresql.Driver
      # 연계 DB (MSSQL)
#    external:
#      jdbc-url: jdbc:sqlserver://192.168.250.180:1433;databaseName=SI_HANAHQ_T;encrypt=true;trustServerCertificate=true
#      username: sa
#      password: "!Q2w3e4r"
#      #jdbc-url: jdbc:sqlserver://210.91.59.66:2022;databaseName=SI_HANAHQ_T;encrypt=true;trustServerCertificate=true
#      #username: DtMpole
#      #password: mPole20261*
#      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      # 새 DB이므로 처음엔 create로 테이블을 생성하고, 이후엔 update로 바꾸세요.
      ddl-auto: update
      naming:
        # 이 설정이 CamelCase를 snake_case로 바꾸는 주범을 제거합니다.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_updates: true # update sql 정렬
        # PostgreSQL에 최적화된 쿼리를 생성하도록 방언 설정
        # PostgreSQLDialect 를 상속해 enum CHECK 제약 생성만 차단한 커스텀 방언.
        # (global/config/NoEnumCheckPostgreSQLDialect.java 참고)
        dialect: com.mpole.hana.digitaltwin.global.config.NoEnumCheckPostgreSQLDialect
        format_sql: false
        show_sql: false
        default_batch_fetch_size: 1000 # 보통 100~500 권장
    defer-datasource-initialization: true  # JPA 테이블 생성 후 data.sql 실행

# SQL 디버깅 로그 (실행 SQL + 바인딩 파라미터 + DDL)
#  - org.hibernate.SQL=debug          : 실행되는 SQL 문(에러 직전 SQL이 범인)
#  - org.hibernate.orm.jdbc.bind=trace: ? 자리에 바인딩되는 실제 값 (Hibernate 6)
#  - org.hibernate.tool.schema=debug  : 시작 시 생성/변경(ALTER/CREATE) DDL
logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.tool.schema: INFO

# JWT 설정 (관제 시스템 최적화)
jwt:
  secret: hdt-digitaltwin-secret-key-2026-hanaDream-security-token-key-minimum-256-bits
  #expiration: 1800000              # Access Token: 30분
  expiration: 180000000              # Access Token: 3000분
  refresh-expiration: 7776000000   # Refresh Token: 90일


# 비밀번호 정책
password:
  change-period-days: 90
  min-length: 8
  require-special-char: true
  require-number: true
  require-uppercase: true

# 인증 및 세션 정책
auth:
  max-devices-per-user: 10
  allow-concurrent-sessions: true

# 로그 보관 (스케줄러 1개가 정책을 읽어 접속/사용 로그 순차 삭제)
app:
  log-retention:
    purge-enabled: true
    purge-cron: "0 0 3 * * ?"   # 매일 03:00 (서버 로컬 시간대)

  # 건물조명(LCS) 도메인 — 등록 장비/스키마 확정 전 포인트 tag 계약을 여기서 정의
  building-lighting:
    system-id: 3              # tbl_device_system.system_id (건물조명 LCS)
    onoff-tag: onoff          # 점/소등 상태 포인트 tag_name (DI, 0/1)
    dimming-tag: dimming      # 디밍(밝기) 포인트 tag_name (AI, 0~100)
    comm-stale-seconds: 120   # 현재값이 이 시간(초)보다 오래되면 통신 비정상

management:
  server:
    port: 8085
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    # RabbitMQ 미사용(호출 코드 0). 안 뜬 broker 핑으로 health 전체가 DOWN(503) 되는 것 방지.
    rabbit:
      enabled: false

hdt:
  kafka:
    topic:
      view01: view01                      # gateway/event 의 hdt.kafka.topic.view01 과 동일해야 함 (버튼 번들 발행)
  monitor:
    targets:
      event: http://localhost:8091
      gateway: http://localhost:8090
      digitaltwin: http://localhost:8085
    dependencies: DB=192.168.250.181:5432,Kafka=192.168.250.249:9092,mqtt=192.168.250.249:9092
  integration:
    xn:
      base-url: http://210.91.59.66:6500
      auth:
        id: ${XN_AUTH_ID:device-admin}
        key: ${XN_AUTH_KEY:device-secret-key-2026}   # 운영에선 env 로만 주입하고 이 기본값 제거
      endpoints:
        token: /api/auth/token
        command: /api/device/command
      timeout-ms: 3000
      token-response-field: accessToken
    hqs:
      base-url: #http://100.78.173.16/partner-api/   # HQS 운영 서버
      paths:
        login: /api/v1/login/external         # JWT 발급. 이 호출만 Authorization 없이 나간다
        wc-button: /inbound/device/api/v1/wcinfo/alarm   # 화장실 물리버튼 알림 전송 경로
      login:
        client-id: hqs-access-control
        client-value: ${HQS_CLIENT_VALUE:g2KCx0e4mSL2jv+rfl2+MHD4DWv/cHu08TBInQCAGhs=}  # 자격증명 — 운영은 환경변수로 덮어쓸 것
      timeout-ms: 3000
      vacancy-timeout-ms: 60000               # 마지막 움직임 이후 이만큼 지나면 퇴실로 본다(조회 시점 계산). 0=시간검사 없음
      access-token: ${HQS_ACCESS_TOKEN:}      # HQS 호출용 Bearer 토큰. 자격증명이므로 평문 커밋 금지 — 환경변수로 주입
    emblaze:
      enabled: true                          # true 여야 RabbitMQ 수신 config/listener 기동. 실브로커 접속정보 확인 후 전환
      rabbit:
        host: 127.0.0.1                       # 원본 테스트값 — 실브로커 host 로 교체 필요
        monitoring:                           # web은 15672 / AMQP 45672 (AMQPS면 35672+SSL)
          port: 45672
          username: LS-DX-TEST-1
          password: 9325eeb1a0d79c18dcb6c5b855924b2b08644a214337bb04043447edc371f3df
          virtual-host: /
        control:
          port: 45673
