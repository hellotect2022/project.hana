    external:
      jdbc-url: jdbc:sqlserver://192.168.250.180:1433;databaseName=SI_HANAHQ_T;encrypt=true;trustServerCertificate=true
      username: sa
      password: "!Q2w3e4r"
      #jdbc-url: jdbc:sqlserver://210.91.59.66:2022;databaseName=SI_HANAHQ_T;encrypt=true;trustServerCertificate=true
      #username: DtMpole
      #password: mPole20261*
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      # 새 DB이므로 처음엔 create로 테이블을 생성하고, 이후엔 update로 바꾸세요.
      ddl-auto: update
      naming:
        # 이 설정이 CamelCase를 snake_case로 바꾸는 주범을 제거합니다.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_updates: true # update sql 정렬
        # PostgreSQL에 최적화된 쿼리를 생성하도록 방언 설정
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 1000 # 보통 100~500 권장
    defer-datasource-initialization: true  # JPA 테이블 생성 후 data.sql 실행

# JWT 설정 (관제 시스템 최적화)
jwt:
  secret: hdt-digitaltwin-secret-key-2026-hanaDream-security-token-key-minimum-256-bits
  #expiration: 1800000              # Access Token: 30분
  expiration: 180000000              # Access Token: 3000분
  refresh-expiration: 7776000000   # Refresh Token: 90일


# 비밀번호 정책
password:
  change-period-days: 90
  min-length: 8
  require-special-char: true
  require-number: true
  require-uppercase: true

# 인증 및 세션 정책
auth:
  max-devices-per-user: 10
  allow-concurrent-sessions: true

# 로그 보관 (스케줄러 1개가 정책을 읽어 접속/사용 로그 순차 삭제)
app:
  log-retention:
    purge-enabled: true
    purge-cron: "0 0 3 * * ?"   # 매일 03:00 (서버 로컬 시간대)