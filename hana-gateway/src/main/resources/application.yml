hdt:
  polling:
    enabled: true
    fixed-delay-ms: 1000
    pipeline-block-timeout: 5s

  kafka:
    topic:
      raw: test2

  ingestion:
    tcp:
      enabled: false
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 0
      endpoints: []

    modbus:
      enabled: false
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 0

management:
  server:
    port: 8090
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
