server:
  port: 8888

spring:
  application:
    name: hana-gateway
  main:
    #web-application-type: none # 웹서비스 없이 시작함
    web-application-type: reactive # actuator 전용 management 포트(8090)를 위해 reactive 기동 (메인 서버 8080도 함께 뜸, 비즈니스 컨트롤러 없음)
  kafka:
    bootstrap-servers: 192.168.250.249:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      #value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        #buffer.memory: 7108864
        buffer.memory: 67108864  # 64MB로 증설 (기본 32MB는 너무 작음)
        compression.type: lz4  # 여기에 추가
        spring.json.add.type.headers: false
        #max.request.size: 10485760  # 10MB로 증설
        max.request.size: 31457280

storage:
  mssql:
    driver: "sqlserver"
    host: 100.78.173.16
    port: 11433
    user: DtMpole
    password: "mPole20261*"
    database: SI

#    host: 192.168.250.180
#    port: 1433
#    user: sa
#    password: "!Q2w3e4r"
#    database: SI_HANAHQ_T
    # 커서(sp_cursorfetch) 사용 여부. false = 한 번에 스트리밍(대용량 풀스캔에 유리),
