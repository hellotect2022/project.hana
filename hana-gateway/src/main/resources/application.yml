      raw: test

  ingestion:
    tcp:
      enabled: false
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 0
      endpoints: []

    modbus:
      enabled: false
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 0
