server:
  port: 8888

spring:
  application:
    name: hana-gateway
  main:
    #web-application-type: none # 웹서비스 없이 시작함
    web-application-type: reactive # actuator 전용 management 포트(8090)를 위해 reactive 기동 (메인 서버 8080도 함께 뜸, 비즈니스 컨트롤러 없음)
  kafka:
    bootstrap-servers: 192.168.250.249:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      #value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        #buffer.memory: 7108864
        buffer.memory: 67108864  # 64MB로 증설 (기본 32MB는 너무 작음)
        compression.type: lz4  # 여기에 추가
        spring.json.add.type.headers: false
        #max.request.size: 10485760  # 10MB로 증설
        max.request.size: 31457280

storage:
  mssql:
    driver: "sqlserver"
    host: 192.168.250.180
    port: 1433
    user: sa
    password: "!Q2w3e4r"
    database: SI_HANAHQ_T
    # 커서(sp_cursorfetch) 사용 여부. false = 한 번에 스트리밍(대용량 풀스캔에 유리),
    # true = 128행씩 나눠 받음(행 수만큼 왕복 발생). 기본 false.
    prefer-cursored-execution: false

  postgres:
    driver: "postgresql"
    host: 192.168.250.88
    port: 5432
    user: testuser
    password: "1q2w3e"
    database: hdt
    schema: core

hdt:
  # 외부(SI) 뷰 테이블 연동 — 뷰 하나당 블록 하나. 뷰가 늘면 view03 블록을 추가한다.
  dbview:
    # 뷰 #01 — 관제점 값(vwDigitalTwin_01)
    view01:
      enabled: false
      fixed-delay-ms: 1000                # 1초 — 값은 고빈도
      table: vwDigitalTwin_01
      block-timeout: 5s

      # ── 스냅샷 파이프라인(신규 경로) ──────────────────────────────
      # 장비별 포인트 골격을 메모리에 두고 뷰 값을 그 칸에 채운 뒤,
      # 값이 바뀐 장비만 "전체 포인트"로 발행한다.
      #   → 델타 발행 + 하류 통짜 REPLACE 조합에서 안 바뀐 포인트가 소실되던 문제 해결
      # ⚠ 위 view01.enabled(기존 델타 경로)와 동시에 켜지 말 것 — 이중 발행됨.
      #    전환 시: view01.enabled: false + snapshot.enabled: true
      snapshot:
        enabled: true
        fixed-delay-ms: 1000
        meta-refresh-ms: 30000            # 골격(tbl_device_point) 리로드 주기. 값은 이월됨
        block-timeout: 60s
        publish-all-on-start: true        # 기동 직후 1회 전 장비 발행(하류 초기 동기화)

    # 뷰 #02 — 중계기 네트워크 상태(vwDigitalTwin_02)
    # ⚠ enabled=false 유지: state-map(1/2/3 의미)이 채워지기 전에는 켜지 말 것.
    #    (컬럼명은 확정됨 — device_code / status)
    view02:
      enabled: false
      fixed-delay-ms: 10000               # 10초 — 상태는 값보다 저빈도
      table: vwDigitalTwin_02
      code-column: device_code            # 중계기 식별 컬럼(= tbl_device_infra.ref_infra_code 와 매칭)
      state-column: status                # 원시 상태 컬럼(1/2/3)
      block-timeout: 30s
      # ⚠ 미확인: 원시 상태코드 → ConnectionState. 1/2/3 각각의 의미가 확인되면 채울 것.
      #   (매핑에 없는 코드는 UNKNOWN 으로 처리된다 — 미지의 코드가 '정상'으로 둔갑하지 않게)
      state-map: {"1": NORMAL, "2": ABNORMAL, "3": DISCONNECTED}

  kafka:
    topic:
      view01: view01                      # 뷰 #01 관제점 값(DeviceBundle) — event 쪽 동일 값 필요
      view02: view02                      # 뷰 #02 중계기 상태(InfraStatus) — event 쪽 동일 값 필요

  ingestion:
    tcp:
      enabled: false
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 0
      endpoints: []

    modbus:
      enabled: false
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 0

management:
  server:
    port: 8090
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
