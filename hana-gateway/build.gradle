plugins {
    id "java"
    id "org.springframework.boot"
    id "io.spring.dependency-management"
}

dependencies {
    implementation project(":hana-common")
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'io.projectreactor.kafka:reactor-kafka:1.3.23'

    // MSSQL R2DBC 드라이버
    //  runtimeOnly 가 아니라 implementation 인 이유: DatabaseConfig 에서 드라이버 전용 빌더
    //  (MssqlConnectionConfiguration)를 직접 써서 커넥션 옵션을 타입 세이프하게 설정하기 때문.
    //  범용 ConnectionFactoryOptions + Option.valueOf("문자열") 방식은 옵션명 오타를 잡지 못한다.
    implementation 'io.r2dbc:r2dbc-mssql:1.0.4.RELEASE'
    // POSTGRESQL R2DBC 드라이버 (코드에서 드라이버 API 를 직접 쓰지 않아 runtimeOnly 유지)
    runtimeOnly 'org.postgresql:r2dbc-postgresql'


    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "io.projectreactor:reactor-test"
}
