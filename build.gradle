import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
    id "org.springframework.boot" apply false
    id "io.spring.dependency-management" apply false
}

// 빌드 날짜 (예: 20260917)
def buildDate = java.time.LocalDate.now().format(java.time.format.DateTimeFormatter.ofPattern("yyyyMMdd"))

allprojects {
    group = findProperty("group") ?: "com.mpole.hana"
    // 버전 = gradle.properties 의 version + 빌드 날짜   예) 0.0.1-SNAPSHOT-20260917
    version = "${version}-${buildDate}"
}

subprojects {
    pluginManager.withPlugin("java") {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        dependencies {
            implementation "org.springframework.kafka:spring-kafka" // 카프카 기본 설정 (공통)

            compileOnly "org.projectlombok:lombok"
            annotationProcessor "org.projectlombok:lombok"
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
